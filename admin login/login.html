<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Acesso administrativo</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 10%, rgba(239, 68, 68, 0.16), transparent 32rem),
        radial-gradient(circle at 85% 90%, rgba(249, 115, 22, 0.12), transparent 30rem),
        #0b1020;
    }
    main {
      width: min(100%, 410px);
      padding: 32px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.92);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      color: #fca5a5;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: linear-gradient(135deg, #dc2626, #f97316);
      color: white;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 6vw, 2.2rem);
      line-height: 1.1;
    }
    .subtitle {
      margin: 10px 0 26px;
      color: #94a3b8;
      line-height: 1.55;
    }
    label {
      display: block;
      margin: 0 0 8px;
      color: #cbd5e1;
      font-size: 0.9rem;
      font-weight: 700;
    }
    input {
      width: 100%;
      margin: 0 0 18px;
      padding: 13px 14px;
      border: 1px solid #334155;
      border-radius: 11px;
      outline: none;
      background: #0f172a;
      color: #f8fafc;
      font: inherit;
    }
    input:focus {
      border-color: #fb7185;
      box-shadow: 0 0 0 3px rgba(251, 113, 133, 0.14);
    }
    button {
      width: 100%;
      padding: 13px 16px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(135deg, #dc2626, #ea580c);
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled { cursor: wait; opacity: 0.7; }
    #message {
      min-height: 1.4em;
      margin: 16px 0 0;
      color: #fda4af;
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">S</span>
      <span>Softcore</span>
    </div>
    <h1>Acesso administrativo</h1>
    <p class="subtitle">Entre com suas credenciais para carregar o painel protegido.</p>
    <form id="login-form">
      <label for="user">Usuário</label>
      <input id="user" name="user" autocomplete="username" required autofocus />
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button id="submit" type="submit">Entrar</button>
      <p id="message" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById('login-form');
    const submit = document.getElementById('submit');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submit.disabled = true;
      message.textContent = '';
      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user: document.getElementById('user').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          message.textContent = body.error || 'Não foi possível entrar.';
          return;
        }
        window.location.replace('/admin/');
      } catch {
        message.textContent = 'Servidor indisponível. Tente novamente.';
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
